name: Deploy Docs

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v1.0.0) - check available tags with: git tag --list'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Build Docs Website
        run: |
          uv run mike deploy --push --update-aliases ${{ inputs.tag || github.ref_name }} latest
          uv run mike set-default --push latest